name: Optional Linux GUI smoke
on:
  workflow_dispatch:
  push:
    branches:
      - v0.2-linux
    paths:
      - ".github/workflows/linux-gui-smoke.yml"
      - "client/tests/test_linux_pygame_smoke.py"
      - "tests/test_linux_designer_smoke.py"
      - "pytest.ini"

jobs:
  pygame-x11-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.10' }
      - run: sudo apt-get update
      - name: Install virtual X server
        run: sudo apt-get install --no-install-recommends xvfb
      - run: python -m pip install -U pip
      - name: Install replay and test dependencies
        run: python -m pip install -e ".[replay,dev]"
      - name: Exercise one display-backed replay frame and deterministic quit
        run: xvfb-run -a python -m pytest -q client/tests/test_linux_pygame_smoke.py

designer-x11-smoke:
  runs-on: ubuntu-latest

  env:
    QT_OPENGL: software
    QT_DEBUG_PLUGINS: "1"
    QT_QPA_PLATFORM: xcb
    LIBGL_ALWAYS_SOFTWARE: "1"

  steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Qt X11 runtime libraries
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          libegl1 \
          libgl1 \
          libxkbcommon-x11-0 \
          libxcb-cursor0 \
          libxcb-icccm4 \
          libxcb-image0 \
          libxcb-keysyms1 \
          libxcb-randr0 \
          libxcb-render-util0 \
          libxcb-shape0 \
          libxcb-xinerama0 \
          libxcb-xkb1

    - name: Install Designer dependencies
      run: python -m pip install -e '.[designer,dev]'

    - name: Inspect Qt XCB dependencies
      run: |
        plugin="$(python - <<'PY'
        from pathlib import Path
        import PySide6
        print(Path(PySide6.__file__).resolve().parent / "Qt/plugins/platforms/libqxcb.so")
        PY
        )"
        echo "$plugin"
        ldd "$plugin" || true

    - name: Exercise X11 startup, primary window creation, and deterministic shutdown
      run: xvfb-run -a python -m pytest -q tests/test_linux_designer_smoke.py
