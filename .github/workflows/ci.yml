name: CI

on: [push, pull_request]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.10' }
      - run: python -m pip install -U pip
      - run: pip install -e ".[replay,designer,dev]"
      - run: pytest -q

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.10' }
      - run: python -m pip install -U pip
      - run: pip install -e ".[replay,designer,dev,windows-build]"
      - name: Build EXEs
        shell: pwsh
        run: pwsh tools/build_win.ps1
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-exes
          path: dist/windows/**
