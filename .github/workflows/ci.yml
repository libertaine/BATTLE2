name: CI

on: [push, pull_request]

jobs:
  test-linux-core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "${{ matrix.python-version }}" }
      - run: python -m pip install -U pip
      - name: Install core and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check .
      - name: Confirm pure launcher import isolation
        run: >-
          python -c "import sys; import battle_engine.launchers,
          app.services.engine_commands; forbidden = [name for name in sys.modules
          if name == 'PySide6' or name.startswith('PySide6.') or name == 'pygame'
          or name.startswith('pygame.')]; assert not forbidden, forbidden"
      - name: Run core and headless tests
        run: python -m pytest -q -m "not gui"

  build-linux-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.10' }
      - run: python -m pip install -U pip build
      - name: Build wheel
        run: python -m build --wheel
      - name: Inspect wheel contents and entry points
        run: python tools/check_wheel.py dist/bytefray-*.whl

  build-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.10' }
      - run: python -m pip install -U pip
      - run: pip install -e ".[replay,designer,dev,windows-build]"
      - name: Run Windows-native process-containment and worker tests
        # test-linux-core only runs on ubuntu-latest, so the Windows Job
        # Object path in battle_engine.process_containment (and the
        # worker/supervised-runtime tests that depend on it) never
        # actually executes in CI otherwise -- sys.platform == "win32"
        # guards it out entirely on the Linux runner. This is a narrow,
        # fast subset (not the full suite, which already runs per-Python-
        # version on Linux) specifically to get real Windows containment
        # coverage from a runner that's already provisioned for this job.
        run: python -m pytest engine/tests/test_process_containment.py engine/tests/test_agent_worker.py engine/tests/test_supervised_runtime.py -q
      - name: Run Windows-native agent-revision (NTFS junction) tests
        # Same rationale as above, for a second Windows-only surface: real
        # NTFS directory junctions (mklink /J, which needs no elevation,
        # unlike a symbolic link) only actually exist on this runner --
        # test-linux-core never exercises battle_engine.agent_revisions'
        # junction/reparse-point containment at all. This is exactly the
        # gap an Ultra adversarial review found: a Windows-only detection
        # bug in that module had no CI coverage on any Windows runner,
        # only on Linux where the relevant code path never executes.
        run: python -m pytest engine/tests/test_agent_revisions.py engine/tests/test_agent_evaluation_revision_capture.py -q
      - name: Build EXEs
        shell: pwsh
        run: pwsh tools/build_win.ps1
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-exes
          path: dist/windows/**
