# pytest.ini
[pytest]
addopts = -q -m "not gui" --basetemp=.pytest-tmp
pythonpath =
    _legacy
testpaths =
    _legacy/tests
    engine/tests
    client/tests
# Display-backed tests are excluded above and exercised explicitly by the
# dedicated X11 workflow, including the Designer test under root tests/.
norecursedirs =
    dist
    build
    runs
    .venv
    .pytest-tmp
    .pytest-cache
markers =
    gui: optional display-backed Linux GUI smoke test
# Repo-local, git-ignored cache/temp roots (see .gitignore) rather than the
# OS default (%TEMP%\pytest-of-<user> / .pytest_cache): portable across
# Windows and Linux, and immune to a stale, differently-ACL'd directory
# left behind under the OS default path by some other tool/account -- see
# docs/WINDOWS_DEV_NOTES.md for the incident this worked around.
cache_dir = .pytest-cache
