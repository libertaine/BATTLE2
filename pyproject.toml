# pyproject.toml — Bytefray (formerly BATTLE2)
# Uses setuptools backend; supports src-style layout in BOTH engine/src and client/src.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bytefray"
version = "0.9.0"
description = "Bytefray: a programmable-agent arena, inspired by Core War, with deterministic VM and Python agents. Formerly BATTLE2."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rod Satterfield" }]
keywords = ["corewar", "pmars", "ai-agents", "pygame", "simulation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

# ---- Runtime dependencies (keep core minimal; GUI in extras) ----
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
replay = [
  "pygame>=2.5",
]
designer = [
  "PySide6>=6.5",
]
# Compatibility aggregate for the v0.1 documented extra.
gui = [
  "pygame>=2.5",
  "PySide6>=6.5",
]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pytest>=8",
  "types-PyYAML",
]
# Windows build toolchain
windows-build = [
  "pyinstaller>=6.6",
  "pefile>=2023.2.7",
]

[project.scripts]
bytefray              = "battle_engine.command:main"
battle2               = "battle_engine.command:battle2_main"
battle-agent-designer = "battle_engine.legacy:agent_designer"
battle-cli            = "battle_engine.legacy:battle_cli"


[project.urls]
Homepage = "https://github.com/libertaine/Bytefray"
Issues = "https://github.com/libertaine/Bytefray/issues"

# -------------------- setuptools config --------------------

[tool.setuptools]
# Include non-Python files (see [tool.setuptools.package-data] below)
include-package-data = true

# Discover packages from BOTH trees.
[tool.setuptools.packages.find]
where = ["engine/src", "client/src", "."]
include = ["battle_engine*", "battle_client*", "app*"]

[tool.setuptools.package-dir]
battle_engine = "engine/src/battle_engine"
battle_client = "client/src/battle_client"
app = "app"

# Only package-local runtime data belongs here. Repository-level agents are user
# data discovered at runtime; pMARS binaries and third-party licenses are release
# inputs and are deliberately not folded into the Python wheel.
[tool.setuptools.package-data]
app = [
  "assets/**/*",
  "images/**/*",
  "sounds/**/*",
]
battle_engine = [
  "data/**/*",
  "warriors/**/*",
]

# If you prefer installing external, non-package files to a known location, you can
# instead use data-files (commented out here; enable if you want to place files
# outside the package, e.g., share/battle2). Many projects stick to package-data.
# [tool.setuptools.data-files]
# "share/battle2/warriors" = ["warriors/*"]
# "share/battle2/licenses" = ["third_party_licenses/*"]

# -------------------- Ruff (example) --------------------
[tool.ruff]
line-length = 100
target-version = "py310"

# -------------------- mypy --------------------
# The engine and client packages live under two separate src roots
# (engine/src, client/src). A plain `pip install -e .` on some platforms
# (observed on Windows: setuptools' PEP 660 hook-based editable install)
# doesn't expose that layout to mypy's own import resolution, which is
# static and doesn't follow the install's runtime import hooks -- so
# checking a client file standalone fails to resolve `battle_engine.*`
# unless the caller manually sets MYPYPATH. Declaring both roots here
# makes plain `mypy <path>` resolve correctly on any platform/shell,
# with no shell-specific environment variable required. Canonical
# commands: `mypy engine/src/battle_engine` and
# `mypy client/src/battle_client`.
[tool.mypy]
mypy_path = ["engine/src", "client/src"]
